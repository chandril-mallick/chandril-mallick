  <text x="100" y="184" class="val">HealX · PathShala AI · Dabba AI</text>
  <line x1="22" y1="194" x2="438" y2="194" class="divider" />
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze" />

  <text x="22" y="216" class="label">exp:</text>
