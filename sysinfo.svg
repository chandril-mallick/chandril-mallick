<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260">
<style>
      .bg { fill: #0d1117; rx: 10px; }
      .header-bar { fill: #161b22; }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; }
      .label { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
      .val { fill: #c9d1d9; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
      .prompt { fill: #7ee787; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
      .cursor { fill: #58a6ff; }
    </style>
<rect width="460" height="260" class="bg" stroke="#30363d" stroke-width="1"/>
<path d="M 0 10 Q 0 0 10 0 L 450 0 Q 460 0 460 10 L 460 32 L 0 32 Z" class="header-bar"/>
<circle cx="16" cy="16" r="5" class="btn-red"/>
<circle cx="32" cy="16" r="5" class="btn-yellow"/>
<circle cx="48" cy="16" r="5" class="btn-green"/>
<text x="230" y="20" text-anchor="middle" class="title">sysinfo.sh — zsh</text>
<g opacity="0" transform="translate(0, 0)">
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze" />

  <text x="20" y="48" class="label">user:</text>
  <text x="100" y="48" class="val">chandril-mallick</text>
</g>
<g opacity="0" transform="translate(0, 0)">
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.45s" fill="freeze" />

  <text x="20" y="76" class="label">role:</text>
  <text x="100" y="76" class="val">Applied ML Engineer</text>
</g>
<g opacity="0" transform="translate(0, 0)">
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze" />

  <text x="20" y="104" class="label">focus:</text>
  <text x="100" y="104" class="val">LLMs, RAG, Healthcare IoT</text>
</g>
<g opacity="0" transform="translate(0, 0)">
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.15s" fill="freeze" />

  <text x="20" y="132" class="label">stack:</text>
  <text x="100" y="132" class="val">Python · FastAPI · Flutter · Docker</text>
</g>
<g opacity="0" transform="translate(0, 0)">
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze" />

  <text x="20" y="160" class="label">now:</text>
  <text x="100" y="160" class="val">Building Dabba AI + SmartSant IoT</text>
</g>
<g opacity="0" transform="translate(0, 0)">
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.85s" fill="freeze" />

  <text x="20" y="188" class="label">paper:</text>
  <text x="100" y="188" class="val">IEEE 2026 · NAPSO framework</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.2s" fill="freeze"/>
<text x="20" y="231" class="prompt">chandril@terminal ~ % </text>
<rect x="195" y="221" width="8" height="13" class="cursor">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
</rect>
</g>
</svg>