  <text x="22" y="152" class="label">stack:</text>
  <text x="100" y="152" class="val">Python · LangChain · FastAPI · Docker</text>
  <line x1="22" y1="162" x2="438" y2="162" class="divider" />
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.3s" fill="freeze" />

